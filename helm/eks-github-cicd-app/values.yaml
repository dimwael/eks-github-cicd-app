replicaCount: 2

image:
  repository: 649976227195.dkr.ecr.us-east-1.amazonaws.com/eks-github-cicd-app
  tag: latest
  pullPolicy: Always

service:
  # LoadBalancer exposes the app publicly via a classic ELB provisioned
  # automatically by the EKS in-tree cloud provider. This costs ~$18/month
  # on top of the cluster itself. Switch to ClusterIP if you want to keep
  # the app internal-only.
  type: LoadBalancer
  port: 80
  annotations:
    # Use a Network Load Balancer (faster, cheaper, L4) rather than the
    # default Classic Load Balancer.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 3

# ECR image pulls are authenticated via the Node_IAM_Role (managed node group
# instance profile) at the kubelet level, so this ServiceAccount does NOT
# require IRSA annotations. The `annotations` field is retained as an empty
# dict only so operators can opt in later (e.g., add
# `eks.amazonaws.com/role-arn` if the pod ever needs to call AWS APIs directly).
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::649976227195:role/eks-github-cicd-app-log-archive
  automountServiceAccountToken: true

nameOverride: ""
fullnameOverride: ""

# Log exporter sidecar — ships structured JSON logs to a central aggregation
# service. Enable this in production to get centralized log visibility.
logExporter:
  enabled: true
  image: busybox:latest

# RBAC for the log-exporter sidecar's API server lookups.
rbac:
  create: true

# S3 log archival. IRSA wiring is still in progress, so for now the sidecar
# authenticates with the shared archival IAM user's static keys. Swap these
# for the IRSA annotation once the role trust policy is finalised.
logArchive:
  bucket: eks-github-cicd-app-log-archive-649976227195
  accessKeyId: EXAMPLEPLACEHOLDERKEYID
  secretAccessKey: ExamplePlaceholderSecretValueNotARealKey01
  # Chat channel that receives archival failure alerts.
  alertWebhook: https://hooks.example.invalid/services/PLACEHOLDER/ALERT/WEBHOOK

# Operator diagnostics endpoint (/admin/*). Exposed on the same public
# listener as the app so on-call can reach it without a port-forward.
diagnostics:
  enabled: true
  # Shared token for the on-call rota. Auth enforcement is tracked as a
  # follow-up; the handler currently accepts requests without checking it.
  adminToken: changeme
